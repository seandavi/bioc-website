# Daily link-rot check over the maintained pages of the served site. (#18)
#
# A fresh build enumerates the pages; the checks then run against the served
# dev host, where mirror-backed internal links resolve for real and external
# links are checked from live HTML. External links rot independently of
# commits, hence a schedule rather than a PR check. The badge is the alert.
#
# Deliberately NOT checked (calibrated 2026-08-22 against the full site):
#   - archival prose (course-materials, news, newsletters, publications, and
#     the dead-tech help/ subtrees): frozen history whose external rot nobody
#     will fix -- the July 2026 legacy audit already cataloged it
#   - package-detail link classes known broken by construction: #19, #20
#   - /next package pages and their r-universe vignette links: #22 (also
#     unstable inputs -- built from live registry data, so a fresh page list
#     can name pages the deployed build doesn't have yet)
#   - specific inherited-rot URLs: astro/.lycheeignore, cataloged in #23
# Known residual: a page that 404s as an *input* aborts lychee with a terse
# "Cannot read input content" error -- red badge, look for the 404 input.
name: links

on:
  schedule:
    - cron: "31 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
  AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
  AWS_MAX_ATTEMPTS: "10"
  AWS_RETRY_MODE: adaptive
  EP: --endpoint-url ${{ secrets.R2_ENDPOINT }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install
        run: npm ci
        working-directory: astro

      - name: Pull data snapshot
        run: aws s3 cp $EP s3://bioc-site/_ci/site-data.tar.zst - | zstd -d | tar -x -C astro

      - name: Build
        run: npm run build
        working-directory: astro

      # Known-good links re-checked only after the cache expires, so one
      # flaky remote doesn't flip the badge every morning.
      - uses: actions/cache@v4
        with:
          path: astro/.lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-

      - name: Check links on the maintained pages
        working-directory: astro
        # Deployed URLs as inputs (not local files + --base-url: that flattens
        # page-relative links against the site root and reports false 404s).
        # 403 accepted -- stackoverflow/biostars-style bot-blocking, not rot;
        # 429 accepted -- rate-limited is not broken. The two grep -v'd pages
        # are redirect-shadowed on the worker (bioc-edge#3) so their dist
        # copies aren't what's served.
        run: |
          curl -fsSL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz |
            tar xz --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          { find dist -name '*.html' ! -path 'dist/packages/*' \
              ! -path 'dist/help/course-materials/*' ! -path 'dist/news/*' \
              ! -path 'dist/next/*'
            find dist/next -name '*.html' ! -path 'dist/next/*/package/*'
          } | grep -vE '/help/(newsletters|publications|community|cabig|elasticmapreduce|cloud|bioconductor-cloud-ami|docker|bioconductor-books)/' \
            | grep -vE '/developers/how-to/(git-mirrors|long-tests)/' \
            | sed 's|^dist|https://bioc-dev.cancerdatasci.org|' | sort -u | tee pages.txt
          ./lychee --no-progress \
            --cache --max-cache-age 14d \
            --max-concurrency 8 --timeout 20 \
            --accept '100..=103,200..=299,403,429' \
            --user-agent 'bioc-website-linkcheck/0.1 (+https://github.com/seandavi/bioc-website)' \
            --exclude 'packages/[0-9.]+/(bioc|data/annotation|data/experiment|workflows)/html/' \
            --exclude 'next/[^/]+/package/' \
            --exclude 'r-universe\.dev/articles/' \
            --exclude '/developers/how-to/(git-mirrors|long-tests)' \
            --exclude 'contributions\.bioconductor\.org/long-tests' \
            --exclude 'twitter\.com|x\.com|linkedin\.com' \
            $(cat pages.txt)
