# Build the site and publish it to R2.
#
#   push to main  -> s3://bioc-site/site/<sha>/     (immutable, pointer in site/latest)
#   pull request  -> s3://bioc-site/preview/pr-<n>/ (mutable, deleted on close)
#
# The Worker (private infra repo) decides what is actually served; this
# workflow only publishes builds. Data comes from a snapshot in R2, not from
# primary sources -- refresh it with the pipeline and re-upload (see README).
name: site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  # aws-cli >= 2.23 sends CRC checksums R2 rejects; only checksum when asked.
  AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
  AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
  # R2 throws transient ServiceUnavailable under sync's concurrency.
  AWS_MAX_ATTEMPTS: "10"
  AWS_RETRY_MODE: adaptive
  EP: --endpoint-url ${{ secrets.R2_ENDPOINT }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install
        run: npm ci
        working-directory: astro

      - name: Pull data snapshot
        run: aws s3 cp $EP s3://bioc-site/_ci/site-data.tar.zst - | zstd -d | tar -x -C astro

      - name: Build
        run: npm run build
        working-directory: astro

      - name: Publish preview
        if: github.event_name == 'pull_request'
        # Second pass only re-touches what the first left behind: sync is
        # idempotent, and one transient failure must not fail the build.
        run: |
          DEST="s3://bioc-site/preview/pr-${{ github.event.number }}"
          aws s3 sync $EP --delete --no-progress astro/dist "$DEST" ||
            aws s3 sync $EP --delete --no-progress astro/dist "$DEST"

      - name: Publish versioned build
        if: github.event_name == 'push'
        run: |
          DEST="s3://bioc-site/site/${{ github.sha }}"
          aws s3 sync $EP --no-progress astro/dist "$DEST" ||
            aws s3 sync $EP --no-progress astro/dist "$DEST"
          echo -n "${{ github.sha }}" | aws s3 cp $EP - s3://bioc-site/site/latest

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://bioc-dev.cancerdatasci.org/_pr/${context.issue.number}/`;
            const marker = '<!-- preview-url -->';
            const body = `${marker}\nPreview for ${context.payload.pull_request.head.sha}: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number });
            const mine = comments.find(c => c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      # Checks run after publish so the preview is already up -- a red check
      # never blocks looking at the thing it complains about. (#17)

      - name: Internal links on template pages
        if: github.event_name == 'pull_request'
        working-directory: astro
        # Offline against dist, scoped to what dist actually owns: the Worker
        # also serves the 5 TB R2 mirror, so package-detail subtrees and
        # mirror-served paths are undecidable offline and excluded here -- the
        # daily links.yml checks those against the real host. The excluded
        # package-page link classes are known-broken content debt: #19, #20.
        # Narrow the excludes when those close.
        run: |
          curl -fsSL https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz |
            tar xz --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          REL=$(ls dist/packages | grep -E '^[0-9]+\.[0-9]+$' | sort -V | tail -1)
          PKG=$(ls "dist/packages/$REL/bioc/html" | head -1)
          ./lychee --offline --root-dir "$PWD/dist" --no-progress \
            --exclude 'packages/[0-9.]+/(bioc|data|workflows)/' \
            --exclude 'packages/(release|devel|stats)(/|$)' \
            --exclude '/checkResults$' --exclude '/dashboard$' \
            --exclude '/about/annual-reports$' --exclude '/developers/help_wanted$' \
            --exclude 'support\.bioconductor\.org' \
            dist/index.html dist/install/index.html dist/about/index.html \
            dist/help/index.html dist/developers/index.html dist/next.html \
            "dist/packages/$REL/BiocViews.html" "dist/packages/$REL/bioc/html/$PKG"

      - name: Accessibility on template pages
        if: github.event_name == 'pull_request'
        # Non-blocking while the baseline is dirty (every template page has
        # WCAG2AA findings today). Flip to blocking once the baseline is clean.
        continue-on-error: true
        working-directory: astro
        run: |
          python3 -m http.server 8080 -d dist &
          REL=$(ls dist/packages | grep -E '^[0-9]+\.[0-9]+$' | sort -V | tail -1)
          PKG=$(ls "dist/packages/$REL/bioc/html" | head -1)
          PUPPETEER_SKIP_DOWNLOAD=1 npx -y pa11y-ci --config .pa11yci.json \
            http://localhost:8080/ http://localhost:8080/install/ \
            http://localhost:8080/help/ http://localhost:8080/next.html \
            "http://localhost:8080/packages/$REL/BiocViews.html" \
            "http://localhost:8080/packages/$REL/bioc/html/$PKG"
